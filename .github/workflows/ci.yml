name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — syntax + boot smoke test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # The backend has no test suite yet; `node --check` at least guarantees
      # every ESM source file parses before we try to boot it.
      - name: Parse-check every source file
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      # The real gate: boot the API against a live Mongo and require /api/health.
      # This catches import cycles, bad env handling, and startup crashes that a
      # syntax check never would.
      - name: Boot API and probe /api/health
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/lumiere_ci
          JWT_SECRET: ci-only-jwt-secret-not-a-real-credential
          CSRF_SECRET: ci-only-csrf-secret-not-a-real-credential
          CLIENT_URL: http://localhost:3000
        run: |
          node src/server.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo "\nAPI healthy"; kill "$(cat /tmp/api.pid)"; exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy within 60s"
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          exit 1

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build

  stack:
    name: Docker — build images and smoke-test the stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Compose refuses to start without these (`${VAR:?}` in docker-compose.yml).
      # Throwaway values — the stack is torn down at the end of the job.
      - name: Write CI env
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CSRF_SECRET=$(openssl rand -hex 32)"
            echo "MASTER_KEY=$(openssl rand -base64 32)"
            echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ALLOW_MOCK_CHECKOUT=true"
          } > .env

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Seed the catalog
        run: docker compose --profile seed run --rm seed

      - name: Probe the API and the storefront
        run: |
          curl -fsS http://localhost:5000/api/health
          curl -fsS http://localhost:5000/api/products | head -c 400
          curl -fsS -o /dev/null -w 'storefront: %{http_code}\n' http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
